<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Pessoa</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Cadastro de Pessoas</h1>
    <nav>
      <a href="/">Início</a>
      <a href="/post/post.html" class="ativo">Cadastrar</a>
      <a href="/get/get.html">Listar</a>
      <a href="/put/put.html">Editar</a>
      <a href="/delete/delete.html">Excluir</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Nova pessoa</h2>
      <form id="formCadastro">
        <div class="grid">
          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
          </div>
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>
          </div>
          <div class="campo">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" required>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>
          </div>
          <div class="campo">
            <label for="idade">Idade</label>
            <input type="number" id="idade" min="0" max="130" required>
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
          </div>
          <div class="campo">
            <label for="rg">RG</label>
            <input type="text" id="rg" required>
          </div>
          <div class="campo">
            <label for="rua">Rua</label>
            <input type="text" id="rua" required>
          </div>
          <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" required>
          </div>
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" required>
          </div>
          <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado" required>
              <option value="">Selecione</option>
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
              <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
              <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
              <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
              <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
              <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
              <option>SP</option><option>SE</option><option>TO</option>
            </select>
          </div>
        </div>
        <div class="botoes">
          <button type="submit" class="btn-verde">Salvar</button>
          <button type="reset">Limpar</button>
        </div>
      </form>
      <div id="mensagem" class="mensagem"></div>
    </div>
  </main>

  <script src="/post/post.js"></script>
</body>
</html>
