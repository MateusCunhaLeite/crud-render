<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excluir Pessoa</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Cadastro de Pessoas</h1>
    <nav>
      <a href="/">Início</a>
      <a href="/post/post.html">Cadastrar</a>
      <a href="/get/get.html">Listar</a>
      <a href="/put/put.html">Editar</a>
      <a href="/delete/delete.html" class="ativo">Excluir</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Buscar por CPF</h2>
      <form id="formBusca" class="busca">
        <input type="text" id="cpfBusca" placeholder="000.000.000-00" maxlength="14" required>
        <button type="submit">Buscar</button>
      </form>
      <div id="mensagem" class="mensagem"></div>
    </div>

    <div class="card escondido" id="areaPessoa">
      <h2>Confirme os dados</h2>
      <div class="detalhes" id="detalhes"></div>
      <div class="botoes">
        <button type="button" id="btnExcluir" class="btn-vermelho">Excluir</button>
        <button type="button" id="btnCancelar">Cancelar</button>
      </div>
    </div>
  </main>

  <script src="/delete/delete.js"></script>
</body>
</html>
